[tool.poetry]
name = "purest"
version = "1.0.1"
description = "Minimal stdlib REST/WebSocket API harness with pluggable auth"
authors = ["Jaroslaw Locchansky <locchansky@gmail.com>"]
packages = [{include = "purest"}]
readme = "README.md"
license = "GPL-3.0-or-later"

[tool.poetry.dependencies]
python = ">3.10,<3.14"
sqlalchemy = ">2.0,<2.1"
pyodbc = { version = ">=5.0,<6", optional = true }

[tool.poetry.extras]
odbc = ["pyodbc"]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
